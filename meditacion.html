<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Meditación Diaria · SEMA</title>
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/straight.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
</head>
<body>
  <div id="sema-nav"></div>
  <div class="dashboard">
    <aside class="sidebar" id="sema-sidebar"></aside>
    <div class="dashboard__main">
      <header class="dashboard-header">
        <div class="dashboard-title">
          <h1>Meditación Diaria</h1>
          <p>Respira, enfócate y reduce tu estrés.</p>
        </div>
        <a href="dashboard.html" class="btn btn-secundario"><i class="fi fi-bs-arrow-left"></i> Volver al Dashboard</a>
      </header>

      <div class="tarjeta text-center" style="max-width: 500px; margin: 2rem auto; padding: 3rem 1rem;">
        <h2 id="timerDisplay" style="font-size: 4rem; margin: 0; color: var(--azul);">05:00</h2>
        <p class="text-suave mb-1-5">Tiempo de respiración</p>
        
        <div class="flex mb-1-5" style="justify-content: center; gap: 1rem;">
          <button class="btn btn-secundario btn-sm" onclick="setTimer(5)">5 min</button>
          <button class="btn btn-secundario btn-sm" onclick="setTimer(10)">10 min</button>
          <button class="btn btn-secundario btn-sm" onclick="setTimer(15)">15 min</button>
        </div>

        <button class="btn btn-primario" id="btnPlay" style="width: 100%; margin-bottom: 1rem;">Iniciar Meditación</button>
        <button class="btn btn-primario" id="btnCompletar" style="width: 100%; display: none; background: var(--verde);"><i class="fi fi-bs-check"></i> Marcar como completada</button>
      </div>
    </div>
  </div>
  <div id="sema-footer"></div>

  <script>
    let tiempoTotal = 300, tiempoRestante = 300, interval = null;
    const display = document.getElementById('timerDisplay');
    const btnPlay = document.getElementById('btnPlay');
    const btnCompletar = document.getElementById('btnCompletar');

    function formatTime(secs) {
      return `${Math.floor(secs / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;
    }

    window.setTimer = function(minutos) {
      if (interval) clearInterval(interval);
      interval = null;
      tiempoTotal = minutos * 60;
      tiempoRestante = tiempoTotal;
      display.textContent = formatTime(tiempoRestante);
      btnPlay.textContent = 'Iniciar Meditación';
      btnPlay.style.display = 'block';
      btnCompletar.style.display = 'none';
    }

    btnPlay.addEventListener('click', () => {
      if (interval) {
        clearInterval(interval);
        interval = null;
        btnPlay.textContent = 'Continuar';
      } else {
        btnPlay.textContent = 'Pausar';
        interval = setInterval(() => {
          tiempoRestante--;
          display.textContent = formatTime(tiempoRestante);
          if (tiempoRestante <= 0) {
            clearInterval(interval);
            interval = null;
            btnPlay.style.display = 'none';
            btnCompletar.style.display = 'block';
            if (typeof mostrarToast === 'function') mostrarToast('¡Meditación terminada!');
          }
        }, 1000);
      }
    });

    btnCompletar.addEventListener('click', async function() {
      this.innerHTML = '<span class="spinner"></span> Guardando...';
      this.disabled = true;
      try {
        await fetchAuth('/habitos/meditaciones', { method: 'POST', body: JSON.stringify({}) });
        if (typeof mostrarToast === 'function') mostrarToast('✅ Registro guardado');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (error) {
        if (typeof mostrarToast === 'function') mostrarToast('❌ Error al guardar');
        this.innerHTML = '<i class="fi fi-bs-check"></i> Marcar como completada';
        this.disabled = false;
      }
    });
  </script>
</body>
</html>
