<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Citas · SEMA</title>
  <meta name="description" content="Gestiona tus citas como psicólogo.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Uicons Bold Straight -->
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/straight.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/citas-psicologo.js"></script>

</head>
<body>

  <div id="sema-nav"></div>

  <div class="dashboard">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h5>Panel Profesional</h5>
      <a href="dashboard-psicologo.html">
        <i class="fi fi-bs-home"></i> Mi Panel
      </a>
      <a href="chat.html">
        <i class="fi fi-bs-comment"></i> Mensajes
      </a>
      <a href="citas-psicologo.html" class="activo">
        <i class="fi fi-bs-calendar"></i> Mis Citas
      </a>
      <a href="pacientes.html">
        <i class="fi fi-bs-users"></i> Mis Pacientes
      </a>
      
      <h5>Cuenta</h5>
      <a href="perfil.html">
        <i class="fi fi-bs-user"></i> Mi Perfil
      </a>
      <a href="configuracion.html">
        <i class="fi fi-bs-settings"></i> Configuración
      </a>
      <a href="index.html" class="logout-link">
        <i class="fi fi-bs-exit"></i> Cerrar sesión
      </a>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dashboard__main">
      
      <header class="dashboard-header">
        <div class="dashboard-title">
          <h1>Mis Citas Agendadas</h1>
          <p>Administra las citas que te han asignado los estudiantes.</p>
        </div>

        <div class="dashboard-actions">
          <button class="notification-btn" title="Notificaciones">
            <i class="fi fi-bs-bell"></i>
          </button>
          
          <div class="user-menu">
            <button id="userMenuBtn" class="user-menu-btn">
              <img class="foto-usuario" src="assets/avatar-default.png" alt="Foto">
              <div class="user-info">
                <span class="nombre-usuario">Cargando...</span>
                <small class="correo-usuario">...</small>
              </div>
              <span class="user-arrow">
                <i class="fi fi-bs-angle-down"></i>
              </span>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <a href="perfil.html">
                <i class="fi fi-bs-user"></i> Mi perfil
              </a>
              <a href="configuracion.html">
                <i class="fi fi-bs-settings"></i> Configuración
              </a>
              <hr>
              <a href="index.html">
                <i class="fi fi-bs-exit"></i> Cerrar sesión
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- FILTROS -->
      <section class="tarjeta" style="margin-top: 1.5rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <button class="btn btn-primario filtro-btn activo" data-filtro="todas">Todas</button>
          <button class="btn btn-secundario filtro-btn" data-filtro="pendiente">Pendientes</button>
          <button class="btn btn-secundario filtro-btn" data-filtro="confirmada">Confirmadas</button>
          <button class="btn btn-secundario filtro-btn" data-filtro="completada">Completadas</button>
          <button class="btn btn-secundario filtro-btn" data-filtro="cancelada">Canceladas</button>
        </div>
      </section>

      <!-- LISTA DE CITAS -->
      <section class="tarjeta" style="margin-top: 1.5rem;">
        <h3><i class="fi fi-bs-calendar-check"></i> Lista de citas</h3>
        <div id="lista-citas-psicologo" style="margin-top: 1rem;">
          <p style="color: var(--texto-secundario);">Cargando citas...</p>
        </div>
      </section>

    </main>
  </div>

  <div id="sema-footer"></div>

</body>
</html>
