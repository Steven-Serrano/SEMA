<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psicólogos · SEMA</title>
<meta name="description" content="Directorio de psicólogos verificados en SEMA.">
<link rel="icon" type="image/png" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome (CDN confiable) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="css/styles.css">
<script defer src="js/api.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/layout.js"></script>

<style>
  /* Ajuste general para iconos */
  .fa-solid {
    vertical-align: middle;
    margin-right: 0.5rem;
  }
  /* Ajuste para el chip */
  .chip .fa-solid {
    font-size: 0.9em;
  }
  /* Estilos para el buscador con icono integrado */
  .search-wrapper {
    position: relative;
  }
  .search-wrapper .fa-solid {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--texto-secundario, #64748b);
    margin-right: 0;
    pointer-events: none; /* Permite hacer clic en el input a través del icono */
  }
  .search-wrapper input {
    padding-left: 2.5rem; /* Espacio para que el texto no tape el icono */
    width: 100%;
  }
</style>
</head>
<body>
<div id="sema-nav"></div>

<section class="seccion contenedor">
  <div class="seccion__titulo">
    <span class="chip">
      <i class="fa-solid fa-user-shield"></i> Directorio verificado
    </span>
    <h2>Encuentra tu psicólogo/a ideal</h2>
    <p>Profesionales con credenciales revisadas, especializados en jóvenes.</p>
  </div>

  <!-- Buscador con icono integrado -->
  <div class="form-grupo search-wrapper" style="max-width:520px; margin:0 auto 2rem">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" id="buscador-psi" placeholder="Buscar por nombre o especialidad..." aria-label="Buscar psicólogo">
  </div>

  <div class="grid grid-3" id="psi-grid">
    <!-- Se llena con JS -->
    <p style="grid-column: 1/-1; text-align: center; color: var(--texto-secundario);">Cargando directorio...</p>
  </div>
</section>

<div id="sema-footer"></div>

<script defer src="js/psicologos.js"></script>
</body>
</html>
