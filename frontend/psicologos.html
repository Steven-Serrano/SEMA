<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psicólogos · SEMA</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/straight.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/psicologos.js"></script>
</head>
<body>

  <div id="sema-nav"></div>

  <div class="dashboard">
    <!-- SIDEBAR DINÁMICO -->
    <aside class="sidebar" id="sema-sidebar"></aside>

    <main class="dashboard__main">
      <header class="dashboard-header">
        <div class="dashboard-title">
          <h1>Directorio de Psicólogos</h1>
          <p>Encuentra al profesional ideal para acompañarte en tu proceso.</p>
        </div>
      </header>

      <!-- BUSCADOR (Opcional, pero se ve muy bien) -->
      <div class="tarjeta mb-1-5">
        <div class="form-grupo" style="max-width: 400px; margin: 0 auto; position: relative;">
          <i class="fi fi-bs-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--texto-suave);"></i>
          <input type="search" id="buscador-psicologos" placeholder="Buscar por nombre o especialidad..." style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.5rem; border-radius: 999px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); outline: none;">
        </div>
      </div>

      <!-- LISTA DE PSICÓLOGOS -->
      <div class="grid grid-3 aparecer-1" id="lista-psicologos">
        <p class="text-suave text-center" style="grid-column: 1 / -1; padding: 2rem;">Cargando profesionales...</p>
      </div>

    </main>
  </div>

  <div id="sema-footer"></div>
</body>
</html>
