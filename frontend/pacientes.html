<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Pacientes · SEMA</title>
  <meta name="description" content="Lista de pacientes del psicólogo.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/pacientes.js"></script>
</head>
<body>

  <div id="sema-nav"></div>

  <div class="dashboard">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h5>Panel Profesional</h5>
      <a href="dashboard-psicologo.html">🏠 Mi Panel</a>
      <a href="chat.html">💬 Mensajes</a>
      <a href="citas-psicologo.html">📅 Mis Citas</a>
      <a href="pacientes.html" class="activo">👥 Mis Pacientes</a>
      
      <h5>Cuenta</h5>
      <a href="perfil.html">👤 Mi Perfil</a>
      <a href="configuracion.html">⚙️ Configuración</a>
      <a href="index.html" class="logout-link"> Cerrar sesión</a>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dashboard__main">
      
      <header class="dashboard-header">
        <div class="dashboard-title">
          <h1>Mis Pacientes</h1>
          <p>Lista de estudiantes con los que tienes conversaciones activas.</p>
        </div>

        <div class="dashboard-actions">
          <button class="notification-btn" title="Notificaciones">🔔</button>
          
          <div class="user-menu">
            <button id="userMenuBtn" class="user-menu-btn">
              <img class="foto-usuario" src="assets/avatar-default.png" alt="Foto">
              <div class="user-info">
                <span class="nombre-usuario">Cargando...</span>
                <small class="correo-usuario">...</small>
              </div>
              <span class="user-arrow">▼</span>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <a href="perfil.html">👤 Mi perfil</a>
              <a href="configuracion.html">⚙️ Configuración</a>
              <hr>
              <a href="index.html">🚪 Cerrar sesión</a>
            </div>
          </div>
        </div>
      </header>

      <!-- BUSCADOR -->
      <section class="tarjeta" style="margin-top: 1.5rem;">
        <div class="form-grupo" style="max-width: 500px;">
          <input type="search" id="buscador-pacientes" placeholder="🔎 Buscar por nombre o email..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo); color: var(--texto);">
        </div>
      </section>

      <!-- LISTA DE PACIENTES -->
      <section class="tarjeta" style="margin-top: 1.5rem;">
        <h3>Pacientes activos</h3>
        <div id="lista-pacientes" style="margin-top: 1rem;">
          <p style="color: var(--texto-secundario);">Cargando pacientes...</p>
        </div>
      </section>

    </main>
  </div>

  <div id="sema-footer"></div>

</body>
</html>
