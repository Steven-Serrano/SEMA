<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Citas · SEMA</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/straight.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/citas.js"></script>
</head>
<body>

  <div id="sema-nav"></div>

  <div class="dashboard">
    <aside class="sidebar" id="sema-sidebar"></aside>

    <main class="dashboard__main">
      <header class="dashboard-header">
        <div class="dashboard-title">
          <h1>Mis Citas</h1>
          <p>Agenda, revisa y gestiona tus sesiones con profesionales.</p>
        </div>
        <a href="psicologos.html" class="btn btn-secundario"><i class="fi fi-bs-search"></i> Buscar Psicólogos</a>
      </header>

      <div class="grid grid-2 aparecer-1" style="align-items: start; gap: 2rem;">
        
        <!-- FORMULARIO -->
        <div class="tarjeta">
          <div class="flex align-center gap-0-5 mb-1-5">
            <div class="tarjeta__icono" style="margin: 0; width: 40px; height: 40px; font-size: 1.2rem;"><i class="fi fi-bs-calendar-plus"></i></div>
            <h3 style="margin: 0;">Agendar nueva cita</h3>
          </div>
          
          <form id="form-cita">
            <div class="form-grupo">
              <label for="psi">Selecciona un profesional *</label>
              <select id="psi" required>
                <option value="">Cargando profesionales...</option>
              </select>
            </div>

            <div class="grid grid-2">
              <div class="form-grupo">
                <label for="fecha">Fecha *</label>
                <input type="date" id="fecha" required>
              </div>
              <div class="form-grupo">
                <label for="hora">Hora *</label>
                <!-- 🔑 SELECT DINÁMICO -->
                <select id="hora" required disabled>
                  <option value="">Elige psicólogo y fecha primero</option>
                </select>
              </div>
            </div>

            <div class="form-grupo">
              <label for="motivo">Motivo de la consulta (Opcional)</label>
              <input type="text" id="motivo" placeholder="Ej. Ansiedad por exámenes, seguimiento, etc.">
            </div>

            <button type="submit" class="btn btn-primario mt-1" id="btn-enviar-cita" style="width:100%; padding: 1rem; font-size: 1.05rem;">
              <i class="fi fi-bs-check"></i> Confirmar cita
            </button>
          </form>
        </div>

        <!-- LISTA DE CITAS -->
        <div class="tarjeta">
          <div class="flex align-center gap-0-5 mb-1-5">
            <div class="tarjeta__icono" style="margin: 0; width: 40px; height: 40px; font-size: 1.2rem; background: var(--verde);"><i class="fi fi-bs-list"></i></div>
            <h3 style="margin: 0;">Mis próximas citas</h3>
          </div>
          <div id="lista-citas">
            <p class="text-suave text-center">Cargando citas...</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="sema-footer"></div>
</body>
</html>
