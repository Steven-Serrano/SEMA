<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Admin Login · SEMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/auth-admin.js"></script>
</head>
<body>
  <div class="login" style="grid-template-columns: 1fr;">
    <div class="login__right" style="background: var(--gradiente);">
      <div class="login__card" style="max-width: 450px;">
        <div class="text-center mb-1-5">
          <i class="fa-solid fa-shield-halved" style="font-size: 3rem; color: var(--azul); margin-bottom: 1rem;"></i>
          <h2>Acceso Administrativo</h2>
          <p>Ingresa tus credenciales institucionales.</p>
        </div>

        <form id="adminLoginForm">
          <div class="form-grupo">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="admin@sema.com" required>
          </div>
          <div class="form-grupo">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primario login__btn mt-1" id="btnLogin">
            <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Panel
          </button>
        </form>

        <div class="login__back mt-1">
          <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
