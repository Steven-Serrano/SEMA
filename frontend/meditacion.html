<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meditación Diaria · SEMA</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/straight.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
</head>
<body>

  <div id="sema-nav"></div>
  
  <div class="dashboard">
    <aside class="sidebar" id="sema-sidebar"></aside>
    
    <main class="dashboard__main">
      <header class="dashboard-header" style="border-bottom: none; margin-bottom: 0;">
        <div class="dashboard-title">
          <h1>Meditación Diaria</h1>
          <p>Respira, enfócate y reduce tu estrés.</p>
        </div>
        <a href="dashboard.html" class="btn btn-secundario"><i class="fi fi-bs-arrow-left"></i> Volver al Dashboard</a>
      </header>

      <div class="meditacion-container">
        <div class="breathing-circle" id="circulo-respiracion">
          <h2 class="timer-text" id="timerDisplay">05:00</h2>
          <span class="timer-label" id="timerLabel">Tiempo de respiración</span>
        </div>

        <div class="time-pills" id="time-pills">
          <button class="time-pill activo" onclick="setTimer(5)">5 min</button>
          <button class="time-pill" onclick="setTimer(10)">10 min</button>
          <button class="time-pill" onclick="setTimer(15)">15 min</button>
        </div>

        <button class="btn-play-meditacion" id="btnPlay" aria-label="Iniciar meditación">
          <i class="fi fi-bs-play" style="margin-left: 5px;"></i>
        </button>

        <button class="btn btn-primario btn-completar" id="btnCompletar" style="display: none;">
          <i class="fi fi-bs-check"></i> Marcar como completada
        </button>
      </div>
    </main>
  </div>

  <div id="sema-footer"></div>

  <script>
    let tiempoTotal = 300, tiempoRestante = tiempoTotal, interval = null, enMarcha = false;
    const display = document.getElementById('timerDisplay');
    const btnPlay = document.getElementById('btnPlay');
    const btnCompletar = document.getElementById('btnCompletar');
    const circulo = document.getElementById('circulo-respiracion');
    const label = document.getElementById('timerLabel');
    const pills = document.querySelectorAll('.time-pill');

    function formatTime(secs) {
      return `${Math.floor(secs / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;
    }

    window.setTimer = function(minutos) {
      if (enMarcha) return;
      tiempoTotal = minutos * 60;
      tiempoRestante = tiempoTotal;
      display.textContent = formatTime(tiempoRestante);
      pills.forEach(p => p.classList.remove('activo'));
      event.target.classList.add('activo');
      btnCompletar.style.display = 'none';
      btnPlay.style.display = 'flex';
      label.textContent = 'Tiempo de respiración';
    }

    btnPlay.addEventListener('click', () => {
      if (enMarcha) {
        clearInterval(interval);
        enMarcha = false;
        btnPlay.innerHTML = '<i class="fi fi-bs-play" style="margin-left: 5px;"></i>';
        btnPlay.classList.remove('activo');
        circulo.classList.remove('activo');
        label.textContent = 'En pausa';
      } else {
        enMarcha = true;
        btnPlay.innerHTML = '<i class="fi fi-bs-pause"></i>';
        btnPlay.classList.add('activo');
        circulo.classList.add('activo');
        label.textContent = 'Inhala... Exhala...';
        interval = setInterval(() => {
          tiempoRestante--;
          display.textContent = formatTime(tiempoRestante);
          if (tiempoRestante <= 0) {
            clearInterval(interval);
            enMarcha = false;
            display.textContent = "00:00";
            btnPlay.style.display = 'none';
            circulo.classList.remove('activo');
            label.textContent = '¡Lo lograste!';
            btnCompletar.style.display = 'inline-flex';
          }
        }, 1000);
      }
    });

    btnCompletar.addEventListener('click', async function() {
      this.innerHTML = '<span class="spinner"></span> Guardando...';
      this.disabled = true;
      try {
        await fetchAuth('/habitos/meditaciones', { method: 'POST', body: JSON.stringify({}) });
        if (typeof mostrarToast === 'function') mostrarToast('✅ Meditación registrada');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (error) {
        if (typeof mostrarToast === 'function') mostrarToast('❌ Error al guardar');
        this.innerHTML = '<i class="fi fi-bs-check"></i> Marcar como completada';
        this.disabled = false;
      }
    });
  </script>
</body>
</html>
