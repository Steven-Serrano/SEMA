<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración · SEMA</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/straight.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/configuracion.js"></script>
</head>
<body>

  <div id="sema-nav"></div>

  <div class="dashboard">
    <!-- 🔑 AQUÍ TAMBIÉN DEJAMOS EL SIDEBAR VACÍO -->
    <aside class="sidebar" id="sema-sidebar"></aside>

    <main class="dashboard__main">
      <header class="dashboard-header">
        <div class="dashboard-title">
          <h1>Configuración</h1>
          <p>Administra tu información personal, foto y seguridad.</p>
        </div>
      </header>

      <div class="grid grid-2" style="align-items: start; gap: 2rem;">
        
        <!-- COLUMNA IZQUIERDA: FOTO E INFO -->
        <div>
          <!-- Foto -->
          <section class="tarjeta mb-1-5">
            <h3><i class="fi fi-bs-picture"></i> Foto de perfil</h3>
            <div class="flex align-center gap-1 mt-1">
              <img id="previewFoto" src="assets/avatar-default.png" alt="Foto" class="foto-usuario" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--azul);">
              <div>
                <input type="file" id="fotoPerfilInput" accept="image/*" class="oculto-visual">
                <button type="button" class="btn btn-secundario btn-sm" onclick="document.getElementById('fotoPerfilInput').click()">
                  <i class="fi fi-bs-camera"></i> Seleccionar
                </button>
                <button class="btn btn-primario btn-sm ml-0-5" id="guardarFoto">
                  <i class="fi fi-bs-upload"></i> Subir
                </button>
              </div>
            </div>
          </section>

          <!-- Info personal -->
          <section class="tarjeta">
            <h3><i class="fi fi-bs-clipboard"></i> Información personal</h3>
            <div class="mt-1">
              <div class="form-grupo">
                <label>Nombre completo</label>
                <input type="text" id="nombre">
              </div>
              <div class="form-grupo">
                <label>Correo electrónico</label>
                <input type="email" id="correo">
              </div>
              <div class="form-grupo">
                <label>Documento</label>
                <input type="text" id="documento">
              </div>
              <div class="form-grupo">
                <label>Teléfono</label>
                <input type="tel" id="telefono">
              </div>
              <div class="form-grupo">
                <label>Ciudad</label>
                <input type="text" id="ciudad">
              </div>
              <div class="form-grupo">
                <label>Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento">
              </div>
              <div class="form-grupo">
                <label>Género</label>
                <select id="genero">
                  <option value="">Selecciona</option>
                  <option>Masculino</option>
                  <option>Femenino</option>
                  <option>Otro</option>
                  <option>Prefiero no decirlo</option>
                </select>
              </div>
              <div class="form-grupo">
                <label>Biografía</label>
                <textarea id="biografia" rows="3" placeholder="Cuéntanos un poco sobre ti..."></textarea>
              </div>
            </div>
            <button class="btn btn-primario mt-1" id="guardarPerfil" style="width: 100%;">
              <i class="fi fi-bs-check"></i> Guardar información
            </button>
          </section>
        </div>

        <!-- COLUMNA DERECHA: SEGURIDAD -->
        <div>
          <section class="tarjeta">
            <h3><i class="fi fi-bs-lock"></i> Seguridad</h3>
            <p class="text-suave text-sm mb-1">Cambia tu contraseña periódicamente para mantener tu cuenta segura.</p>
            
            <div class="form-grupo">
              <label>Contraseña actual</label>
              <input type="password" id="passwordActual" placeholder="••••••••">
            </div>
            <div class="form-grupo">
              <label>Nueva contraseña</label>
              <input type="password" id="passwordNueva" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-grupo">
              <label>Confirmar nueva contraseña</label>
              <input type="password" id="passwordConfirmar" placeholder="Repite la nueva contraseña">
            </div>

            <button class="btn btn-secundario mt-1" id="guardarPassword" style="width: 100%;">
              <i class="fi fi-bs-key"></i> Actualizar contraseña
            </button>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="sema-footer"></div>
</body>
</html>
